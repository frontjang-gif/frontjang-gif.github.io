<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>
    {% seo title=false %}
    {% include meta.html %}

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/favicon-32x32.png">
    {% include analytics_head.html %}
  </head>

  <body>
    <div id="bar"></div>
    <div class="wrapper-container">
      <div class="wrapper-masthead">
        <div class="container">
          <header class="masthead clearfix">
            <a href="{{ site.baseurl }}/" class="site-avatar"></a>

            <div class="site-info">
              <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
              <p class="site-description">{{ site.description }}</p> 
            </div>

            <nav>
              <a href="{{ site.baseurl }}/">Home</a>
              <a href="{{ site.baseurl }}/search">Search</a>
              <a href="{{ site.baseurl }}/archive">Archive</a>
              <a href="{{ site.baseurl }}/categories">Categories</a>
              <a href="{{ site.baseurl }}/tags">Tags</a>
            </nav>
          </header>
        </div>
      </div>

      <div class="wrapper-main">
        <div class="main-layout">
          <div id="main" role="main" class="container">
            {{ content }}
          </div>
          {% include site-sidebar.html %}
        </div>
      </div>

      <div class="wrapper-footer">
        <div class="container">
          <footer class="footer">
            {% include svg-icons.html %}
          </footer>
        </div>
      </div>
    </div>

    {% include analytics.html %}
    <script>
      document.querySelectorAll('.site-sidebar summary > a').forEach(function (link) {
        link.addEventListener('click', function (event) {
          event.stopPropagation();
        });
      });

      (function () {
        function normalizedPath(value) {
          try { value = decodeURIComponent(value); } catch (error) {}
          return value.replace(/\/+$/, '') || '/';
        }

        var currentPath = normalizedPath(window.location.pathname);
        document.querySelectorAll('.site-sidebar summary > a').forEach(function (link) {
          var linkPath = normalizedPath(new URL(link.href, window.location.origin).pathname);
          if (linkPath === '/' || (currentPath !== linkPath && !currentPath.startsWith(linkPath + '/'))) return;

          if (currentPath === linkPath) link.setAttribute('aria-current', 'page');
          var folder = link.closest('details');
          while (folder) {
            folder.open = true;
            folder = folder.parentElement.closest('details');
          }
        });
      })();

      (function () {
        var views = ['text', 'preview', 'tile'];
        var labels = { text: 'Text', preview: 'Half preview', tile: 'Tiles' };
        var savedView = 'preview';
        try {
          var storedView = localStorage.getItem('list-view');
          if (views.indexOf(storedView) !== -1) savedView = storedView;
        } catch (error) {}

        var lists = Array.from(document.querySelectorAll('.posts:not(.media-catalog)')).filter(function (list) {
          return list.querySelector('.post-card');
        });
        if (!lists.length) return;

        var controls = document.createElement('div');
        controls.className = 'list-view-controls';
        controls.setAttribute('aria-label', 'List view');

        function selectView(view) {
          lists.forEach(function (list) {
            list.setAttribute('data-list-view', view);
          });
          controls.querySelectorAll('button').forEach(function (button) {
            button.setAttribute('aria-pressed', String(button.dataset.view === view));
          });
        }

        views.forEach(function (view) {
          var button = document.createElement('button');
          button.type = 'button';
          button.dataset.view = view;
          button.textContent = labels[view];
          button.addEventListener('click', function () {
            selectView(view);
            try { localStorage.setItem('list-view', view); } catch (error) {}
          });
          controls.appendChild(button);
        });

        var limitLabel = document.createElement('label');
        limitLabel.className = 'list-item-limit';
        limitLabel.textContent = 'Items ';
        var limitSelect = document.createElement('select');
        var limits = ['5', '10', '20', 'all'];
        limits.forEach(function (value) {
          var option = document.createElement('option');
          option.value = value;
          option.textContent = value === 'all' ? 'All' : value;
          limitSelect.appendChild(option);
        });

        var savedLimit = '10';
        try {
          var storedLimit = localStorage.getItem('list-item-limit');
          if (limits.indexOf(storedLimit) !== -1) savedLimit = storedLimit;
        } catch (error) {}

        function selectLimit(value) {
          var limit = value === 'all' ? Infinity : Number(value);
          var index = 0;
          lists.forEach(function (list) {
            list.querySelectorAll('.post-card').forEach(function (card) {
              card.hidden = index >= limit;
              index += 1;
            });
          });
        }

        limitSelect.value = savedLimit;
        limitSelect.addEventListener('change', function () {
          selectLimit(limitSelect.value);
          try {
            localStorage.setItem('list-item-limit', limitSelect.value);
          } catch (error) {}
        });
        limitLabel.appendChild(limitSelect);
        controls.insertBefore(limitLabel, controls.firstChild);
        selectLimit(savedLimit);

        lists[0].parentNode.insertBefore(controls, lists[0]);
        selectView(savedView);
      }());
    </script>
  </body>
</html>
