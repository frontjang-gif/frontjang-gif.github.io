name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Generate music Markdown pages
        run: ruby scripts/normalize_music_filenames.rb && ruby scripts/generate_music_pages.rb

      - name: Check music album title lengths
        run: ruby scripts/check_music_title_lengths.rb

      - name: Test music title length checker
        run: ruby test/music_title_length_test.rb

      - name: Test Tistory migration helper
        run: python3 test/migrate_tistory_test.py

      - name: Test Classical promotion gate
        run: python3 test/process_classical_files_test.py

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Test album rendering conventions
        run: bundle exec ruby test/album_rendering_test.rb

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
